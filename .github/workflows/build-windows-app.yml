name: Build Train Monitoring Windows app

on:
  workflow_dispatch:
  push:
    branches:
      - Asude-Branch
    paths:
      - ".github/workflows/build-windows-app.yml"
      - ".streamlit/config.toml"
      - "packaging/Build_LIGHTRACK_EXE.ps1"
      - "packaging/Choose_Train_Monitoring_Data_Folder.cmd"
      - "packaging/README_EXE.md"
      - "fbg_analysis_dashboard_strict.py"
      - "train_monitoring_ui.py"
      - "recording_io.py"
      - "axle_detector.py"
      - "lightrack_exe.py"
      - "assets/two_period_peak_change_mean_std_pm.csv"
      - "requirements.txt"
      - "requirements-build.txt"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build Windows application
        shell: pwsh
        run: ./packaging/Build_LIGHTRACK_EXE.ps1 -PythonPath (Get-Command python).Source

      - name: Assemble distributable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/windows/TrainMonitoring -DestinationPath Train_Monitoring_Windows.zip -CompressionLevel Optimal

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: Train-Monitoring-Windows
          path: Train_Monitoring_Windows.zip
          if-no-files-found: error
          retention-days: 14
