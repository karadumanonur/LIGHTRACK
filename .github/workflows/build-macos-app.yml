name: Build Train Monitoring macOS apps

on:
  workflow_dispatch:
  push:
    branches:
      - Asude-Branch
    paths:
      - ".github/workflows/build-macos-app.yml"
      - ".streamlit/config.toml"
      - "packaging/build_lightrack_macos.sh"
      - "packaging/Choose_Train_Monitoring_Mac_Data_Folder.command"
      - "fbg_analysis_dashboard.py"
      - "lightrack_exe.py"
      - "assets/two_period_peak_change_mean_std_pm.csv"
      - "packaging/README_MAC.md"
      - "requirements-build.txt"
      - "requirements.txt"
      - "self_calibrating_axle_detector.py"
      - "sensor12_peak_tracker.py"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: apple-silicon
          - runner: macos-15-intel
            architecture: intel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build native macOS application
        env:
          LIGHTRACK_MAC_DIST: ${{ github.workspace }}/mac-dist
          LIGHTRACK_MAC_WORK: ${{ github.workspace }}/mac-work
        run: bash packaging/build_lightrack_macos.sh

      - name: Assemble distributable folder
        run: |
          mkdir -p "package/Train_Monitoring_macOS_${{ matrix.architecture }}"
          cp -R "mac-dist/Train Monitoring.app" "package/Train_Monitoring_macOS_${{ matrix.architecture }}/"
          cp packaging/README_MAC.md "package/Train_Monitoring_macOS_${{ matrix.architecture }}/"
          cp packaging/Choose_Train_Monitoring_Mac_Data_Folder.command "package/Train_Monitoring_macOS_${{ matrix.architecture }}/"
          chmod +x "package/Train_Monitoring_macOS_${{ matrix.architecture }}/Choose_Train_Monitoring_Mac_Data_Folder.command"
          ditto -c -k --sequesterRsrc --keepParent \
            "package/Train_Monitoring_macOS_${{ matrix.architecture }}" \
            "Train_Monitoring_macOS_${{ matrix.architecture }}.zip"

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v7
        with:
          name: Train-Monitoring-macOS-${{ matrix.architecture }}
          path: Train_Monitoring_macOS_${{ matrix.architecture }}.zip
          if-no-files-found: error
          retention-days: 14
