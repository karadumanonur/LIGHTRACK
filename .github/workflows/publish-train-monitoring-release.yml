name: Publish Train Monitoring release

on:
  push:
    branches: [Asude-Branch]
    paths: [".github/workflows/publish-train-monitoring-release.yml"]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_COMMIT: 0f09c94a2a8f8c47384fdf5ebecb025915710b09
    steps:
      - name: Require successful builds of the release commit
        shell: bash
        run: |
          for run in 33857566265 33857566205; do
            gh run watch "$run" --repo asude48/LIGHTRACK --exit-status --interval 30
            test "$(gh run view "$run" --repo asude48/LIGHTRACK --json headSha --jq .headSha)" = "$BUILD_COMMIT"
          done

      - name: Download verified packages
        shell: bash
        run: |
          mkdir -p release-assets/windows release-assets/apple-silicon release-assets/intel
          gh run download 33857566265 --repo asude48/LIGHTRACK --name Train-Monitoring-Windows --dir release-assets/windows
          gh run download 33857566205 --repo asude48/LIGHTRACK --name Train-Monitoring-macOS-apple-silicon --dir release-assets/apple-silicon
          gh run download 33857566205 --repo asude48/LIGHTRACK --name Train-Monitoring-macOS-intel --dir release-assets/intel
          unzip -t release-assets/windows/Train_Monitoring_Windows.zip
          unzip -t release-assets/apple-silicon/Train_Monitoring_macOS_apple-silicon.zip
          unzip -t release-assets/intel/Train_Monitoring_macOS_intel.zip

      - name: Attach verified packages to the prepared v0.1.5 draft
        shell: bash
        run: |
          test "$(gh release view v0.1.5 --repo asude48/LIGHTRACK --json isDraft --jq .isDraft)" = true
          gh release upload v0.1.5 --repo asude48/LIGHTRACK release-assets/windows/Train_Monitoring_Windows.zip release-assets/apple-silicon/Train_Monitoring_macOS_apple-silicon.zip release-assets/intel/Train_Monitoring_macOS_intel.zip
