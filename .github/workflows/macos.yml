# PyInstaller does not cross-compile, so the Mac program cannot be built on the
# Windows machine the rest of this is made on. It is built here instead.
#
# Run it by hand from the Actions tab, giving the release tag the disk image
# should be attached to. Both architectures are built: Apple Silicon Macs
# cannot run an Intel bundle without Rosetta, and Intel Macs cannot run an
# Apple Silicon one at all. They are independent — one failing leaves the
# other's disk image on the release — so to save runner minutes when only one
# is wanted, re-run the single job you need from the run's page.
#
# The test opens the installed bundle through LaunchServices rather than
# running the binary inside it. A bundle can be built so that the binary works
# and the bundle does not, and that is exactly the failure a stranger meets.

name: Mac disk image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: the release tag to attach the disk image to
        required: true
        default: v1.4

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      # The checkout has to be called `lightrack`: it is the name the code
      # imports itself by.
      - uses: actions/checkout@v4
        with:
          path: lightrack
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Asude's engine lives on her branch and is not vendored into main, so
      # it is laid down here the same way `lightrack.compare` lays it down
      # locally. Without this the disk image would ship with one engine while
      # the Windows build ships with two.
      - name: Lay down Asude's engine
        working-directory: lightrack
        run: |
          mkdir -p .sides/asude
          git show origin/Asude-Branch:sensor12_peak_tracker.py \
            > .sides/asude/sensor12_peak_tracker.py
          test -s .sides/asude/sensor12_peak_tracker.py

      - name: Install what it needs
        working-directory: lightrack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt \
                                -r packaging/requirements-build.txt

      - name: Build
        working-directory: lightrack
        run: python -m PyInstaller --noconfirm packaging/lightrack.spec

      - name: Look at what was built
        working-directory: lightrack
        run: |
          test -d dist/LIGHTRACK.app || { echo "no bundle"; exit 1; }
          test -x dist/LIGHTRACK.app/Contents/MacOS/LIGHTRACK
          test -f dist/LIGHTRACK.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' \
            dist/LIGHTRACK.app/Contents/Info.plist
          du -sh dist/LIGHTRACK.app

      # An ad-hoc signature is not a developer identity and does not get past
      # quarantine, but without one Apple Silicon refuses an unsigned bundle
      # outright rather than offering the "open anyway" a person can answer.
      - name: Sign it ad-hoc
        working-directory: lightrack
        run: |
          codesign --force --deep --sign - dist/LIGHTRACK.app
          codesign --verify --deep --strict --verbose=2 dist/LIGHTRACK.app

      - name: Make the disk image
        working-directory: lightrack
        run: |
          rm -rf staging && mkdir staging
          cp -R dist/LIGHTRACK.app staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname LIGHTRACK -srcfolder staging \
            -ov -format UDZO "LIGHTRACK-${{ matrix.arch }}.dmg"
          shasum -a 256 "LIGHTRACK-${{ matrix.arch }}.dmg"

      # Installed the way a person installs it: mount the image, drag the app
      # across, eject. Everything after this point is testing what they will
      # actually have, not what the build directory happens to hold.
      - name: Install it from the disk image
        working-directory: lightrack
        run: |
          rm -rf "$HOME/Library/Application Support/LIGHTRACK"
          rm -rf /Applications/LIGHTRACK.app
          hdiutil attach "LIGHTRACK-${{ matrix.arch }}.dmg" \
            -mountpoint /Volumes/LIGHTRACK -nobrowse -quiet
          cp -R /Volumes/LIGHTRACK/LIGHTRACK.app /Applications/
          hdiutil detach /Volumes/LIGHTRACK -quiet
          test -x /Applications/LIGHTRACK.app/Contents/MacOS/LIGHTRACK

      # A build that starts is not a build that works. This makes a record
      # with axles we chose and asks the program to count them, checking the
      # answer against what the same record gives on Windows. Two builds of
      # the same code over the same bytes must agree.
      - name: Count something, opening it as a person would
        working-directory: lightrack
        run: |
          python packaging/make_fake_record.py fake
          python packaging/smoke_test.py /Applications/LIGHTRACK.app fake

      - name: What the program wrote
        if: always()
        run: |
          log="$HOME/Library/Application Support/LIGHTRACK/lightrack.log"
          if [ -f "$log" ]; then cat "$log"; else echo "no log written"; fi

      - name: Attach it to the release
        working-directory: lightrack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            "LIGHTRACK-${{ matrix.arch }}.dmg" --clobber
